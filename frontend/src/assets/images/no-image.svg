<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern overlay -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#fbcfe8" stroke-width="0.5"/>
  </pattern>
  <rect width="400" height="400" fill="url(#grid)"/>

  <!-- Cosmetic bottle icon — centered -->
  <g transform="translate(200,200)">
    <!-- Bottle body -->
    <rect x="-30" y="-50" width="60" height="90" rx="12" ry="12" fill="url(#icon)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Bottle neck -->
    <rect x="-14" y="-78" width="28" height="30" rx="6" ry="6" fill="url(#icon)" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Cap -->
    <rect x="-18" y="-95" width="36" height="20" rx="8" ry="8" fill="#ec4899" fill-opacity="0.25" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Highlight line on bottle -->
    <rect x="-18" y="-30" width="6" height="50" rx="3" fill="white" fill-opacity="0.4"/>
    <!-- Label area -->
    <rect x="-22" y="-15" width="44" height="28" rx="4" fill="white" fill-opacity="0.3"/>
    <!-- Label lines (decorative) -->
    <line x1="-14" y1="-6" x2="14" y2="-6" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="-10" y1="2" x2="10" y2="2" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="-12" y1="9" x2="12" y2="9" stroke="#ec4899" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round"/>
    <!-- Pump top -->
    <ellipse cx="0" cy="-95" rx="18" ry="5" fill="#ec4899" fill-opacity="0.2"/>
    <!-- Pump stem -->
    <line x1="0" y1="-90" x2="0" y2="-70" stroke="#ec4899" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
    <!-- Pump nozzle -->
    <path d="M 0 -70 Q 18 -70 18 -60" fill="none" stroke="#ec4899" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- "Sin imagen" text -->
  <text x="200" y="330" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif"
        font-size="13" fill="#be185d" fill-opacity="0.6" letter-spacing="1">
    Sin imagen disponible
  </text>
</svg>
