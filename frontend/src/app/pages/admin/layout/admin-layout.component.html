<!-- frontend/src/app/pages/admin/layout/admin-layout.component.html -->
<div class="admin-shell">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">

    <!-- Logo wordmark (igual al header, adaptado para sidebar oscuro) -->
    <a class="sidebar-logo-wordmark" routerLink="/" aria-label="ELA Beauty — inicio">
      <span class="sidebar-logo-ela">ELA</span>
      <span class="sidebar-logo-line"></span>
      <span class="sidebar-logo-beauty">Beauty</span>
    </a>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
          class="sidebar-link"
        >
          <lucide-icon [name]="item.icon" [size]="16"></lucide-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <!-- Selector de tema -->
      <div class="theme-switcher">
        <span class="theme-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          </svg>
          Tema
        </span>
        <div class="theme-buttons">
          <!-- Light -->
          <button class="theme-btn"
            [class.active]="themeService.theme() === 'light'"
            (click)="themeService.setTheme('light')" title="Claro">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
          <!-- Dark -->
          <button class="theme-btn"
            [class.active]="themeService.theme() === 'dark'"
            (click)="themeService.setTheme('dark')" title="Oscuro">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
        <!-- Accessibility dropdown -->
        <select class="theme-a11y-select"
          [class.active]="isA11yTheme"
          [ngModel]="isA11yTheme ? themeService.theme() : ''"
          (ngModelChange)="$event && themeService.setTheme($event)"
          aria-label="Tema de accesibilidad visual">
          <option value="" disabled>Accesibilidad</option>
          @for (t of a11yThemes; track t.value) {
            <option [value]="t.value">{{ t.label }}</option>
          }
        </select>
      </div>

      <!-- Ver catálogo -->
      <a routerLink="/" class="sidebar-link sidebar-link--catalog">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Ver Catálogo</span>
      </a>

      <!-- Cerrar sesión -->
      <button class="sidebar-link sidebar-link--logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- CONTENT AREA -->
  <div class="admin-content">
    <header class="admin-topbar">
      <span class="admin-topbar-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Panel de Administración
      </span>
      <div class="admin-topbar-right">
        <span class="admin-topbar-user">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
          {{ adminName }}
        </span>
      </div>
    </header>

    <main class="admin-main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-toast></app-toast>
</div>
