<div class="favorites-page">
    <div class="container">
        <div class="favorites-header">
            <h1>{{ 'favorites.title' | translate }}</h1>
            <p *ngIf="favorites.length > 0">{{ 'favorites.count' | translate:{ count: favorites.length } }}</p>
        </div>

        <div class="favorites-grid" *ngIf="favorites.length > 0; else emptyFavs">
            <div class="fav-card" *ngFor="let fav of favorites">
                <div class="fav-image">
                    <img [src]="fav.product.image_url" [alt]="fav.product.name">
                    <button class="remove-btn" (click)="removeFavorite(fav.product.id)" [title]="'favorites.remove' | translate">
                        <lucide-icon name="x" [size]="16"></lucide-icon>
                    </button>
                </div>
                <div class="fav-info">
                    <span class="category">{{ fav.product.category }}</span>
                    <h3 routerLink="/busqueda" [queryParams]="{ q: fav.product.name }">{{ fav.product.name }}</h3>
                    <p class="price">{{ fav.product.price | currency:'MXN' }}</p>

                    <button class="btn-maybelline" [disabled]="fav.product.stock === 0"
                        (click)="addToCart(fav.product)">
                        {{ fav.product.stock > 0 ? ('favorites.add_to_cart' | translate) : ('favorites.sold_out' | translate) }}
                    </button>
                </div>
            </div>
        </div>

        <ng-template #emptyFavs>
            <div class="empty-state fade-in">
                <lucide-icon name="heart" [size]="48"></lucide-icon>
                <h2>{{ 'favorites.empty' | translate }}</h2>
                <p>{{ 'favorites.empty_hint' | translate }}</p>
                <button class="btn-maybelline" routerLink="/busqueda">{{ 'favorites.explore' | translate }}</button>
            </div>
        </ng-template>
    </div>
</div>
