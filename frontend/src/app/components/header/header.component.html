<header>
  <!-- Level 1: Utility Bar -->
  <div class="header-utility">
    <div class="container">
      <div class="utility-left">
        <span class="promo-text">
          <lucide-icon name="truck" [size]="14"></lucide-icon>
          {{ 'header.free_shipping' | translate }}
        </span>
      </div>
      <div class="utility-right">
        <select class="header-select" [ngModel]="i18n.lang()" (ngModelChange)="i18n.setLang($event)">
          @for (l of languages; track l.code) {
            <option [value]="l.code">{{ l.flag }} {{ l.label }}</option>
          }
        </select>
        <div class="theme-toggle-group">
          <button class="theme-toggle-btn" [class.active]="themeService.theme() === 'light'" (click)="themeService.setTheme('light')">
            <lucide-icon name="sun" [size]="14"></lucide-icon>
          </button>
          <button class="theme-toggle-btn" [class.active]="themeService.theme() === 'dark'" (click)="themeService.setTheme('dark')">
            <lucide-icon name="moon" [size]="14"></lucide-icon>
          </button>
          <select class="header-select theme-a11y-select" [ngModel]="isA11yTheme ? themeService.theme() : ''" (ngModelChange)="$event && themeService.setTheme($event)">
            <option value="" disabled>♿ ACCESIBILIDAD</option>
            @for (t of a11yThemes; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Level 2 & 3: Branding, Nav & User -->
  <div class="header-main">
    <div class="container">
      
      <!-- Nav (Left) -->
      <nav class="main-nav">
        <a *ngFor="let item of navItems" 
           [routerLink]="item.link" 
           [queryParams]="item.queryParams || {}"
           routerLinkActive="active" 
           class="nav-link">
          {{ item.label | translate }}
        </a>
      </nav>

      <!-- Hamburger (Mobile) -->
      <button class="action-item hamburger" (click)="toggleMobileMenu()">
        <lucide-icon [name]="mobileMenuOpen() ? 'x' : 'menu'" [size]="24"></lucide-icon>
      </button>

      <!-- Logo (Absolute Center) -->
      <a class="logo-wrap" routerLink="/">
        <span class="logo-text-top">ELA</span>
        <span class="logo-line"></span>
        <span class="logo-text-bottom">Beauty</span>
      </a>

      <!-- Actions (Right) -->
      <div class="header-actions">
        <div class="search-wrapper">
          <app-search></app-search>
        </div>

        <button class="action-item" (click)="openFavorites()">
          <lucide-icon name="heart" [size]="20"></lucide-icon>
          <span class="badge" *ngIf="favoritesCount > 0">{{ favoritesCount }}</span>
        </button>

        <button class="action-item" (click)="openCart()">
          <lucide-icon name="shopping-bag" [size]="20"></lucide-icon>
          <span class="badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
        </button>

        <button class="action-item user-trigger" (click)="openAccount()" *ngIf="isLoggedIn">
          <lucide-icon name="circle-user" [size]="20"></lucide-icon>
        </button>

        <a routerLink="/auth/login" class="nav-link" style="font-size: 0.7rem;" *ngIf="!isLoggedIn">
          {{ 'header.login' | translate }}
        </a>
      </div>

    </div>
  </div>
</header>

<!-- Mobile Drawer -->
@if (mobileMenuOpen()) {
  <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  <nav class="mobile-drawer">
    <a *ngFor="let item of navItems" [routerLink]="item.link" (click)="closeMobileMenu()" class="mobile-nav-link">
      {{ item.label | translate }}
    </a>
    <div class="mobile-drawer-divider"></div>
    <div class="mobile-auth" *ngIf="!isLoggedIn">
      <a routerLink="/auth/login" class="btn btn-primary" (click)="closeMobileMenu()">{{ 'header.login' | translate }}</a>
    </div>
    <div class="mobile-auth" *ngIf="isLoggedIn">
      <button class="btn btn-outline" (click)="logout(); closeMobileMenu()">{{ 'header.logout' | translate }}</button>
    </div>
  </nav>
}
