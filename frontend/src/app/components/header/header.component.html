<header>
  <!-- Level 1: Utility Bar -->
  <div class="header-utility">
    <div class="container">
      <div class="utility-left">
        <span class="promo-text" i18n="@@headerFreeShipping">
          <lucide-icon name="truck" [size]="14"></lucide-icon>
          Free Shipping on all orders
        </span>
      </div>
      <div class="utility-right">
        <!-- Language Switcher -->
        <div class="lang-switcher">
          <select class="lang-select" [ngModel]="currentLocale" (ngModelChange)="switchLanguage($event)">
            @for (lang of languages; track lang.code) {
              <option [value]="lang.code">{{ lang.label }} – {{ lang.name }}</option>
            }
          </select>
        </div>

        <div class="theme-toggle-group">
          <button class="theme-toggle-btn" [class.active]="themeService.theme() === 'light'" (click)="themeService.setTheme('light')" i18n-title="@@themeLightTitle" title="Light Mode">
            <lucide-icon name="sun" [size]="14"></lucide-icon>
          </button>
          <button class="theme-toggle-btn" [class.active]="themeService.theme() === 'dark'" (click)="themeService.setTheme('dark')" i18n-title="@@themeDarkTitle" title="Dark Mode">
            <lucide-icon name="moon" [size]="14"></lucide-icon>
          </button>
          <select class="header-select theme-a11y-select" [ngModel]="isA11yTheme ? themeService.theme() : ''" (ngModelChange)="$event && themeService.setTheme($event)">
            <option value="" disabled i18n="@@accessibilityTitle">♿ ACCESIBILIDAD</option>
            @for (t of a11yThemes; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Level 2 & 3: Branding, Nav & User -->
  <div class="header-main">
    <div class="container">

      <!-- Nav (Left) -->
      <nav class="main-nav">
        <a *ngFor="let item of navItems()"
           [routerLink]="item.link"
           [queryParams]="item.queryParams || {}"
           routerLinkActive="active"
           class="nav-link">
          {{ item.label }}
        </a>
      </nav>

      <!-- Hamburger (Mobile) -->
      <button class="action-item hamburger" (click)="toggleMobileMenu()" i18n-aria-label="@@mobileMenuAriaLabel" aria-label="Toggle mobile menu">
        <lucide-icon [name]="mobileMenuOpen() ? 'x' : 'menu'" [size]="24"></lucide-icon>
      </button>

      <!-- Logo (Absolute Center) -->
      <a class="logo-wrap" routerLink="/">
        <span class="logo-text-top">ELA</span>
        <span class="logo-line"></span>
        <span class="logo-text-bottom">Beauty</span>
      </a>

      <!-- Actions (Right) -->
      <div class="header-actions">
        <div class="search-wrapper">
          <app-search></app-search>
        </div>

        <button class="action-item" (click)="openFavorites()" i18n-title="@@favoritesTitle" title="Favorites">
          <lucide-icon name="heart" [size]="20"></lucide-icon>
          <span class="badge" *ngIf="favoritesCount > 0">{{ favoritesCount }}</span>
        </button>

        <button class="action-item" (click)="openCart()" i18n-title="@@cartTitle" title="Shopping Cart">
          <lucide-icon name="shopping-bag" [size]="20"></lucide-icon>
          <span class="badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
        </button>

        <button class="action-item user-trigger" (click)="openAccount()" *ngIf="isLoggedIn" i18n-title="@@accountTitle" title="My Account">
          <lucide-icon name="circle-user" [size]="20"></lucide-icon>
        </button>

        <a routerLink="/auth/login" class="nav-link" style="font-size: 0.7rem;" *ngIf="!isLoggedIn" i18n="@@loginLink">
          Login
        </a>
      </div>

    </div>
  </div>
</header>

<!-- Mobile Drawer -->
@if (mobileMenuOpen()) {
  <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  <nav class="mobile-drawer">

    <!-- Logo inside drawer -->
    <div class="drawer-logo">
      <span class="drawer-logo-text">ELA</span>
      <span class="drawer-logo-sub">Beauty</span>
    </div>

    <!-- Navigation links -->
    <div class="drawer-nav-section">
      <a *ngFor="let item of navItems()"
         [routerLink]="item.link"
         [queryParams]="item.queryParams || {}"
         (click)="closeMobileMenu()"
         routerLinkActive="active"
         class="mobile-nav-link">
        <lucide-icon [name]="item.icon" [size]="18"></lucide-icon>
        {{ item.label }}
      </a>
    </div>

    <div class="mobile-drawer-divider"></div>

    <!-- Quick actions -->
    <div class="drawer-actions-section">
      <button class="mobile-action-link" (click)="openFavorites(); closeMobileMenu()">
        <lucide-icon name="heart" [size]="18"></lucide-icon>
        <span i18n="@@mobileFavorites">Favorites</span>
        <span class="drawer-badge" *ngIf="favoritesCount > 0">{{ favoritesCount }}</span>
      </button>
      <button class="mobile-action-link" (click)="openCart(); closeMobileMenu()">
        <lucide-icon name="shopping-bag" [size]="18"></lucide-icon>
        <span i18n="@@mobileCart">Shopping Cart</span>
        <span class="drawer-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>
      <button class="mobile-action-link" *ngIf="isLoggedIn" (click)="openAccount(); closeMobileMenu()">
        <lucide-icon name="circle-user" [size]="18"></lucide-icon>
        <span i18n="@@mobileAccount">My Account</span>
      </button>
    </div>

    <div class="mobile-drawer-divider"></div>

    <!-- Language switcher in drawer -->
    <div class="drawer-lang-switcher">
      <select class="lang-select drawer-lang-select" [ngModel]="currentLocale" (ngModelChange)="switchLanguage($event)">
        @for (lang of languages; track lang.code) {
          <option [value]="lang.code">{{ lang.label }} – {{ lang.name }}</option>
        }
      </select>
    </div>

    <div class="mobile-auth">
      <a *ngIf="!isLoggedIn" routerLink="/auth/login" class="btn btn-primary" (click)="closeMobileMenu()" i18n="@@loginButtonMobile">Login</a>
      <button *ngIf="isLoggedIn" class="btn btn-outline" (click)="logout(); closeMobileMenu()" i18n="@@logoutButtonMobile">Logout</button>
    </div>

  </nav>
}
