<!-- ═══════════════════════════════════════════════
     HEADER TOP BAR — promo + links + tema
     ═══════════════════════════════════════════════ -->
<div class="header-top">
  <div class="container">
    <div class="header-top-content">

      <span class="promo-text">
        <!-- Truck SVG -->
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
          <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
        {{ 'header.free_shipping' | translate }}
      </span>

      <div class="header-top-right">
        <button class="top-link-btn" disabled [title]="'header.coming_soon' | translate">
          <lucide-icon name="map-pin" [size]="12"></lucide-icon>
          {{ 'header.track_order' | translate }}
        </button>
        <button class="top-link-btn" disabled [title]="'header.coming_soon' | translate">
          <lucide-icon name="help-circle" [size]="12"></lucide-icon>
          {{ 'header.help' | translate }}
        </button>
        <button class="top-link-btn" disabled [title]="'header.coming_soon' | translate">
          <lucide-icon name="phone" [size]="12"></lucide-icon>
          {{ 'header.contact' | translate }}
        </button>

        <span class="top-sep"></span>

        <!-- Selector de tema -->
        <div class="theme-toggle-group" role="group" aria-label="Seleccionar tema">
          <!-- Light -->
          <button class="theme-toggle-btn"
            [class.active]="themeService.theme() === 'light'"
            (click)="themeService.setTheme('light')" title="Claro"
            [attr.aria-pressed]="themeService.theme() === 'light'">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
          <!-- Dark -->
          <button class="theme-toggle-btn"
            [class.active]="themeService.theme() === 'dark'"
            (click)="themeService.setTheme('dark')" title="Oscuro"
            [attr.aria-pressed]="themeService.theme() === 'dark'">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
          <!-- Accessibility dropdown -->
          <select class="theme-a11y-select"
            [class.active]="isA11yTheme"
            [ngModel]="isA11yTheme ? themeService.theme() : ''"
            (ngModelChange)="$event && themeService.setTheme($event)"
            aria-label="Tema de accesibilidad visual"
            title="Accesibilidad visual">
            <option value="" disabled>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              ♿
            </option>
            @for (t of a11yThemes; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
        </div>

        <span class="top-sep"></span>

        <!-- Language selector -->
        <select class="lang-select"
          [ngModel]="i18n.lang()"
          (ngModelChange)="i18n.setLang($event)"
          aria-label="Idioma">
          @for (l of languages; track l.code) {
            <option [value]="l.code">{{ l.flag }} {{ l.label }}</option>
          }
        </select>
      </div>
    </div>
  </div>
</div>


<!-- ═══════════════════════════════════════════════
     HEADER PRINCIPAL
     ═══════════════════════════════════════════════ -->
<header>
  <div class="container">
    <div class="header-content">

      <!-- LOGO — wordmark en código puro -->
      <a class="logo-wordmark" routerLink="/" aria-label="ELA Beauty — inicio">
        <span class="logo-ela">ELA</span>
        <span class="logo-line"></span>
        <span class="logo-beauty">Beauty</span>
      </a>

      <!-- NAVEGACIÓN PRINCIPAL — sin iconos -->
      <nav class="main-nav" aria-label="Navegación principal">
        <a *ngFor="let item of navItems"
           [routerLink]="item.link"
           [queryParams]="item.queryParams || {}"
           routerLinkActive="active"
           class="nav-link">
          {{ item.label }}
        </a>
      </nav>

      <!-- Hamburger (mobile only) -->
      <button class="hamburger-btn" (click)="toggleMobileMenu()"
        [attr.aria-label]="(mobileMenuOpen() ? 'header.menu_close' : 'header.menu_open') | translate"
        [attr.aria-expanded]="mobileMenuOpen()">
        @if (mobileMenuOpen()) {
          <lucide-icon name="x" [size]="22"></lucide-icon>
        } @else {
          <lucide-icon name="menu" [size]="22"></lucide-icon>
        }
      </button>

      <!-- ACCIONES -->
      <div class="header-actions">

        <!-- Búsqueda -->
        <div class="search-wrapper">
          <app-search></app-search>
        </div>

        <!-- No autenticado -->
        <div class="auth-links" *ngIf="!isLoggedIn">
          <a routerLink="/auth/login" class="auth-link">{{ 'header.login' | translate }}</a>
          <span class="auth-sep">·</span>
          <a routerLink="/auth/register" class="auth-link">{{ 'header.register' | translate }}</a>
        </div>

        <!-- Autenticado -->
        <div class="user-profile" *ngIf="isLoggedIn">
          <!-- Acceso rápido al admin -->
          <a *ngIf="isAdmin" routerLink="/admin" class="admin-badge" title="Panel de administración">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Admin
          </a>

          <!-- Cuenta -->
          <button class="icon-btn user-btn" aria-label="Mi cuenta" (click)="openAccount()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span class="user-label">{{ userName }}</span>
          </button>

          <!-- Cerrar sesión -->
          <button class="icon-btn logout-btn" (click)="logout()" [title]="'header.logout' | translate" [attr.aria-label]="'header.logout' | translate">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>

        <!-- Favoritos -->
        <button class="icon-btn fav-btn" aria-label="Favoritos" (click)="openFavorites()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          <span class="badge" *ngIf="favoritesCount > 0">{{ favoritesCount }}</span>
        </button>

        <!-- Carrito -->
        <button class="icon-btn cart-btn" aria-label="Carrito de compras" (click)="openCart()">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
        </button>

      </div>
    </div>
  </div>
</header>

@if (mobileMenuOpen()) {
  <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  <nav class="mobile-drawer" aria-label="Navegación móvil">
    <a *ngFor="let item of navItems"
       [routerLink]="item.link"
       [queryParams]="item.queryParams || {}"
       (click)="closeMobileMenu()"
       class="mobile-nav-link">
      {{ item.label }}
    </a>
    <div class="mobile-drawer-divider"></div>
    <div class="mobile-drawer-controls">
      <select class="lang-select"
        [ngModel]="i18n.lang()"
        (ngModelChange)="i18n.setLang($event)">
        @for (l of languages; track l.code) {
          <option [value]="l.code">{{ l.flag }} {{ l.label }}</option>
        }
      </select>
      <div class="theme-toggle-group" role="group">
        <button class="theme-toggle-btn" [class.active]="themeService.theme() === 'light'"
          (click)="themeService.setTheme('light')" title="Claro">
          <lucide-icon name="sun" [size]="14"></lucide-icon>
        </button>
        <button class="theme-toggle-btn" [class.active]="themeService.theme() === 'dark'"
          (click)="themeService.setTheme('dark')" title="Oscuro">
          <lucide-icon name="moon" [size]="14"></lucide-icon>
        </button>
      </div>
    </div>
    <div class="mobile-drawer-divider"></div>
    <div class="mobile-auth">
      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/auth/login" class="btn-primary" (click)="closeMobileMenu()">
          {{ 'header.login' | translate }}
        </a>
        <a routerLink="/auth/register" class="btn-secondary" (click)="closeMobileMenu()">
          {{ 'header.register' | translate }}
        </a>
      </ng-container>
      <ng-container *ngIf="isLoggedIn">
        <span class="mobile-username">{{ userName }}</span>
        <button class="btn-ghost" (click)="logout(); closeMobileMenu()">
          <lucide-icon name="log-out" [size]="16"></lucide-icon>
          {{ 'header.logout' | translate }}
        </button>
      </ng-container>
    </div>
  </nav>
}
